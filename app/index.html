<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClueFinders 4th Grade Adventures</title>
    <!-- Add to Home Screen: opens full screen and sideways, with the title logo as its icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ClueFinders 4" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
      /* no double-tap zoom on the page's buttons (the canvas already takes its own touches) */
      html { touch-action: manipulation; }
      #app { height: 100%; }
      .fatal { color: #fbb; padding: 20px; white-space: pre-wrap; }
      .browser { display: grid; grid-template-columns: 170px 1fr; height: 100%; }
      .sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #2a2a2a; }
      .sidebar input { margin: 8px; padding: 6px; background: #1b1b1b; color: #ddd; border: 1px solid #333; border-radius: 4px; }
      .bundle-list { list-style: none; margin: 0; padding: 0 0 8px; overflow: auto; }
      .bundle-list button { width: 100%; text-align: left; padding: 3px 10px; background: none; border: 0; color: #bbb; font: inherit; cursor: pointer; }
      .bundle-list button:hover, .bundle-list button.active { background: #26303d; color: #fff; }
      .main { overflow: auto; padding: 10px 14px; min-width: 0; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
      .toolbar button, .toolbar select, .toolbar input[type=number], .sounds button {
        background: #222; color: #ddd; border: 1px solid #3a3a3a; border-radius: 4px; padding: 4px 8px; font: inherit; }
      .toolbar input[type=number] { width: 4.5em; }
      .title { font-weight: 600; margin-right: 6px; }
      .stage canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; border: 1px solid #333; }
      .info { font-family: ui-monospace, monospace; color: #9ab; margin: 6px 0 4px; min-height: 1.4em; }
      h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 14px 0 6px; }
      .resources, .sounds { display: flex; flex-wrap: wrap; gap: 8px; }
      .res { width: 100px; padding: 6px; background: #1b1b1b; border: 1px solid #2e2e2e; border-radius: 6px; color: #bbb; font: inherit; text-align: left; cursor: pointer; }
      .res:disabled { cursor: default; opacity: .6; }
      .res.active { border-color: #5a8dd6; }
      .thumb-box { height: 80px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 3px;
        background: repeating-conic-gradient(#2c2c2c 0 25%, #222 0 50%) 0 0 / 12px 12px; }
      .thumb { transform-origin: 0 0; image-rendering: pixelated; }
      .meta { font-size: 11px; margin-top: 4px; }
      .bad { color: #e99; }
      .game { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; box-sizing: border-box; height: 100%; overflow: auto;
        /* long presses and taps belong to the game: no text selection, callout menu or grey tap flash */
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
        /* height taken by everything but the game: padding, gaps, the bar and the log */
        --chrome: 104px; }
      .game-stage canvas { display: block; width: calc(100% - 2px); height: auto; image-rendering: pixelated; border: 1px solid #333; }
      /* as wide as fits, and no taller than the screen (a phone held sideways is short) */
      .game-stage { width: min(960px, 100%, (100vh - var(--chrome)) * 4 / 3); width: min(960px, 100%, (100dvh - var(--chrome)) * 4 / 3); }
      .rotate-hint { display: none; color: #cbd5e1; background: #26303d; border-radius: 6px; padding: 8px 12px; text-align: center; }
      @media (orientation: portrait) and (pointer: coarse) { .rotate-hint { display: block; } }
      /* short screens: once the game starts, give it all the height */
      @media (max-height: 600px) {
        .game { padding: 4px; gap: 4px; --chrome: 10px; }
        .game:has(#game-start) { --chrome: 48px; }
        .game-bar:not(:has(#game-start)), .game-log { display: none; }
      }
      .game-bar { display: flex; gap: 12px; align-items: center; color: #9ab; }
      .game-bar button { background: #26303d; color: #fff; border: 1px solid #3a4a5d; border-radius: 4px; padding: 5px 14px; font: inherit; cursor: pointer; }
      .game-bar a { color: #7fa7d9; }
      .game-log { width: min(960px, 100%); color: #9ab; -webkit-user-select: text; user-select: text; }
      .game-log pre { max-height: 180px; overflow: auto; font-size: 11px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
